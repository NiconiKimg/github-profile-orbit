<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 900 300"
  width="100%"
  height="300"
  style="max-width: 900px; background-color: var(--color-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; overflow: hidden; border: 1px solid var(--color-card-border);"
>
  <style>
    
    :root {
      --color-bg: #080C16;
      --color-bg-secondary: #0B132B;
      --color-card-bg: rgba(15, 23, 42, 0.72);
      --color-card-border: rgba(148, 163, 184, 0.14);
      --color-text-primary: #F8FAFC;
      --color-text-secondary: #94A3B8;
      --color-text-muted: #64748B;
      --color-accent: #38BDF8;
      --color-accent-glow: rgba(56, 189, 248, 0.35);
      --color-orbit-line: rgba(148, 163, 184, 0.16);
      --color-constellation-line: rgba(96, 165, 250, 0.22);
      --color-grid-line: rgba(148, 163, 184, 0.08);
      --color-star-dust: rgba(255, 255, 255, 0.75);
      --color-radar-ring: rgba(56, 189, 248, 0.12);
      --color-badge-bg: rgba(30, 41, 59, 0.7);
      --color-sun-core: #FFFFFF;
      --color-node-stroke: rgba(255, 255, 255, 0.4);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --color-bg: #FFFFFF;
        --color-bg-secondary: #F8FAFC;
        --color-card-bg: rgba(248, 250, 252, 0.95);
        --color-card-border: rgba(203, 213, 225, 0.95);
        --color-text-primary: #0F172A;
        --color-text-secondary: #334155;
        --color-text-muted: #64748B;
        --color-accent: #0284C7;
        --color-accent-glow: rgba(2, 132, 199, 0.25);
        --color-orbit-line: rgba(100, 116, 139, 0.22);
        --color-constellation-line: rgba(2, 132, 199, 0.35);
        --color-grid-line: rgba(226, 232, 240, 0.85);
        --color-star-dust: rgba(148, 163, 184, 0.55);
        --color-radar-ring: rgba(2, 132, 199, 0.18);
        --color-badge-bg: #F1F5F9;
        --color-sun-core: #F59E0B;
        --color-node-stroke: #FFFFFF;
      }
    }
  

    .title-text {
      font-size: 20px;
      font-weight: 700;
      fill: var(--color-text-primary);
      letter-spacing: -0.02em;
    }
    .subtitle-text {
      font-size: 12px;
      fill: var(--color-text-secondary);
      font-weight: 400;
    }
    .rank-badge {
      fill: var(--color-accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .bullet-sep {
      fill: var(--color-text-muted);
    }
    .metric-pill-bg {
      fill: var(--color-badge-bg);
      stroke: var(--color-card-border);
      stroke-width: 1;
    }
    .metric-label {
      font-size: 9px;
      font-weight: 600;
      fill: var(--color-text-muted);
      letter-spacing: 0.08em;
    }
    .metric-val {
      font-size: 11px;
      font-weight: 700;
      fill: var(--color-text-primary);
    }
    .legend-text {
      font-size: 11px;
      fill: var(--color-text-secondary);
      font-weight: 500;
    }
    .legend-pct {
      fill: var(--color-text-muted);
      font-size: 10px;
    }
    .watermark-text {
      font-size: 10px;
      fill: var(--color-text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.04em;
    }
    .orbit-ring {
      fill: none;
      stroke: var(--color-orbit-line);
      stroke-width: 1;
    }
    .constellation-edge {
      stroke: var(--color-constellation-line);
      stroke-width: 1;
      stroke-dasharray: 2, 2;
    }
    .repo-label {
      font-size: 11px;
      font-weight: 600;
      fill: var(--color-text-primary);
    }
    .repo-sub {
      font-size: 9px;
      fill: var(--color-text-muted);
    }

    /* Keyframe Animations (Native SVG / CSS) */
    @keyframes comet-flight {
      0% {
        transform: translate(-140px, 30px) scale(0.6);
        opacity: 0;
      }
      5% {
        opacity: 0.95;
      }
      15% {
        transform: translate(960px, 290px) scale(1);
        opacity: 0;
      }
      100% {
        transform: translate(960px, 290px) scale(1);
        opacity: 0;
      }
    }

    @keyframes stellar-pulse {
      0%, 100% {
        opacity: 0.22;
        transform: scale(1);
      }
      50% {
        opacity: 0.55;
        transform: scale(1.15);
      }
    }

    @keyframes drift-float-a {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(1.5deg);
      }
    }

    @keyframes drift-float-b {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(5px) rotate(-1.5deg);
      }
    }

    @keyframes twinkle-glow {
      0%, 100% {
        opacity: 0.25;
      }
      50% {
        opacity: 0.9;
      }
    }

    @keyframes ufo-cruise {
      0% {
        transform: translate(-90px, 110px) rotate(3deg);
        opacity: 0;
      }
      3% {
        opacity: 0.95;
      }
      25% {
        transform: translate(210px, 88px) rotate(-3deg);
      }
      50% {
        transform: translate(510px, 120px) rotate(3deg);
      }
      75% {
        transform: translate(810px, 90px) rotate(-2deg);
      }
      97% {
        opacity: 0.95;
      }
      100% {
        transform: translate(1030px, 112px) rotate(3deg);
        opacity: 0;
      }
    }

    @keyframes rocket-flight {
      0% {
        transform: translate(980px, 490px) rotate(-154deg) scale(0.48);
        opacity: 0;
      }
      3% {
        opacity: 0.75;
      }
      45% {
        transform: translate(-140px, -50px) rotate(-154deg) scale(0.48);
        opacity: 0.75;
      }
      46% {
        opacity: 0;
        transform: translate(-140px, -50px) rotate(-154deg) scale(0.48);
      }
      100% {
        opacity: 0;
        transform: translate(-140px, -50px) rotate(-154deg) scale(0.48);
      }
    }

    @keyframes satellite-orbit {
      0% {
        transform: translate(-90px, 185px) rotate(14deg) scale(0.55);
        opacity: 0;
      }
      3% {
        opacity: 0.82;
      }
      96% {
        opacity: 0.82;
      }
      100% {
        transform: translate(1010px, 255px) rotate(5deg) scale(0.55);
        opacity: 0;
      }
    }

    .ufo-scout {
      opacity: 0;
      pointer-events: none;
      animation: ufo-cruise 12s linear infinite;
    }

    .spaceship-scout {
      opacity: 0;
      pointer-events: none;
      animation: rocket-flight 22s linear infinite;
    }

    .satellite-probe {
      opacity: 0;
      pointer-events: none;
      animation: satellite-orbit 16s linear infinite;
    }

    .comet-object {
      opacity: 0;
      pointer-events: none;
      animation: comet-flight 14s cubic-bezier(0.2, 0.7, 0.4, 1) infinite 6s;
    }

    .pulsar-glow {
      transform-origin: center;
      transform-box: fill-box;
      animation: stellar-pulse 4s ease-in-out infinite;
    }

    .drift-node-a {
      transform-origin: center;
      transform-box: fill-box;
      animation: drift-float-a 8s ease-in-out infinite;
    }

    .drift-node-b {
      transform-origin: center;
      transform-box: fill-box;
      animation: drift-float-b 10s ease-in-out infinite;
    }

    .star-twinkle-1 {
      animation: twinkle-glow 3.5s ease-in-out infinite;
    }

    .star-twinkle-2 {
      animation: twinkle-glow 5s ease-in-out infinite 2s;
    }
  </style>

  
    <defs>
      <!-- Core Glow Filter -->
      <filter id="stellar-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
        <feMerge>
          <feMergeNode in="coloredBlur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Intense Nebula Glow Filter -->
      <filter id="nebula-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="12" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Soft Drop Shadow -->
      <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" flood-color="#000000" />
      </filter>

      <!-- Cosmic Core Radial Gradient -->
      <radialGradient id="core-sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--color-sun-core)" stop-opacity="1" />
        <stop offset="35%" stop-color="var(--color-accent)" stop-opacity="0.95" />
        <stop offset="70%" stop-color="#818CF8" stop-opacity="0.6" />
        <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
      </radialGradient>

      <!-- Background Ambient Glow -->
      <radialGradient id="bg-nebula" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.12" />
        <stop offset="50%" stop-color="#6366F1" stop-opacity="0.05" />
        <stop offset="100%" stop-color="transparent" stop-opacity="0" />
      </radialGradient>

      <!-- Subtle Grid Pattern -->
      <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--color-grid-line)" stroke-width="0.75" />
      </pattern>
    </defs>
  

  <!-- Ambient Space Background Layer -->
  <rect width="900" height="300" fill="var(--color-bg)" />
  <rect width="900" height="300" fill="url(#bg-nebula)" />
  <rect width="900" height="300" fill="url(#grid-pattern)" opacity="0.6" />

  
      
